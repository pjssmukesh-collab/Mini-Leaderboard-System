[pytest]
pythonpath = . .. test/ui_testing
testpaths = tests test/ui_testing/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    ui: Full browser UI tests
    smoke: Fast smoke validation tests
    auth: Authentication and authorization tests
    events: Tournament and event management tests
    rules: Rule builder and scoring tests
    upload: Results file upload and validation tests
    leaderboard: Leaderboard and standings tests
    navigation: Navigation and responsive layout tests
